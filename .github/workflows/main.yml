name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'agent name'
        required: true
        default: 'aldrian'
      agent_description:
        description: 'Agent description'
        required: true
        default: 'aldrian AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install ClawHub
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\": \"${{ github.event.inputs.agent_name }}\", \"description\": \"${{ github.event.inputs.agent_description }}\"}"
